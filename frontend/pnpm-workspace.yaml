# pnpm workspace manifest — required, because the build-script settings below
# have nowhere else to live on pnpm 11.
#
# ── Why `packages` exists for a single-package project ───────────────────────
# There are no sub-projects to glob for; this is one app. But `packages` is not
# optional: pnpm validates the manifest and fails with
#
#     ERROR  packages field missing or empty
#
# when the key is absent or an empty list. That is exactly what broke the
# Cloudflare Pages build: its pnpm (10.11.1) is older than the local one (11.x)
# and validates the file, while the version that wrote it did not. Listing `.`
# declares the root project and nothing else.
#
# The trap worth remembering: **pnpm writes this file itself** when it decides to
# block a dependency's install script, and what it writes has no `packages` key.
# Accepting that prompt silently breaks `pnpm install` afterwards.
packages:
  - .

# Build-script approvals (pnpm 11 syntax; pnpm 10 spells this
# `onlyBuiltDependencies` and simply ignores the key here).
#
# pnpm blocks dependency install scripts by default, and both of these want one:
#   esbuild  — verifies/links its platform binary
#   workerd  — the Workers runtime that `wrangler dev` runs (miniflare)
#
# Neither is needed by a Pages build of this app, which is verified rather than
# assumed: with the scripts skipped, `pnpm install --frozen-lockfile && pnpm
# build` still produced a byte-identical bundle.
allowBuilds:
  esbuild: true
  workerd: true
